services:
  erp:
    container_name: erp-service
    build:
      context: ./frontend/ERP
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/ERP:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/ERP/.env
    environment:
      # Estos dos son toggles del propio Docker (hot-reload en Windows/WSL,
      # modo de Next.js), no configuración de la app: se quedan inline en
      # vez de vivir en frontend/ERP/.env.
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    depends_on:
      - gateway

  anuncios:
    container_name: anuncios-service
    build:
      context: ./frontend/ANUNCIOS
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/ANUNCIOS:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - NODE_ENV=development

  # --- Backend (ADR-002: microservicios detrás de un API Gateway) ---
  # Por ahora solo existe el dominio "postulantes"; empresas-vacantes y
  # procesos-seleccion se agregan acá cuando se creen sus microservicios.
  # Cada servicio trae su config en su propio ".env" (copiado de su
  # ".env.example"); acá solo se referencia con "env_file", nada de
  # secretos ni URLs sueltas en este archivo.

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    env_file:
      - ./backend/infra/postgres/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Solo corre la primera vez que se crea el volumen: crea un usuario
      # y una base de datos por microservicio.
      - ./backend/infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    container_name: gateway-service
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/gateway/app:/app/app
    env_file:
      - ./backend/gateway/.env
    depends_on:
      postgres:
        condition: service_healthy
      servicio-postulantes:
        condition: service_started

  servicio-postulantes:
    container_name: postulantes-service
    build:
      context: ./backend
      dockerfile: servicio-postulantes/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./backend/servicio-postulantes/app:/app/app
    env_file:
      - ./backend/servicio-postulantes/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
