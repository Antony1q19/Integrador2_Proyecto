services:
  erp:
    container_name: erp-service
    build:
      context: ./frontend/ERP
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/ERP:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/ERP/.env
    environment:
      # Estos dos son toggles del propio Docker (hot-reload en Windows/WSL,
      # modo de Next.js), no configuración de la app: se quedan inline en
      # vez de vivir en frontend/ERP/.env.
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    depends_on:
      - gateway

  anuncios:
    container_name: anuncios-service
    build:
      context: ./frontend/ANUNCIOS
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/ANUNCIOS:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/ANUNCIOS/.env
    environment:
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    depends_on:
      - gateway

  # --- Backend (ADR-002: microservicios detrás de un API Gateway) ---
  # Gateway + 4 microservicios de dominio. Este docker-compose es para DESARROLLO en la PC:
  # la base de datos es un PostgreSQL local (una base, un esquema por servicio, como RDS en AWS),
  # los archivos se guardan en un volumen local y los correos se escriben en el log.
  # En AWS (producción) todo corre en ECS Fargate + RDS + S3 + SES: ver infra/aws/.
  # Cada servicio trae su config en su propio ".env" (copiado de su ".env.example").

  postgres:
    container_name: postgres-local
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: talenterp
      POSTGRES_USER: talenterp
      POSTGRES_PASSWORD: talenterp
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talenterp -d talenterp"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    container_name: gateway-service
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/gateway/app:/app/app
      - ./backend/libs/shared/shared_kernel:/app/libs/shared_kernel
    env_file:
      - ./backend/gateway/.env
    depends_on:
      postgres:
        condition: service_healthy
      servicio-postulantes:
        condition: service_started

  servicio-postulantes:
    container_name: postulantes-service
    build:
      context: ./backend
      dockerfile: servicio-postulantes/Dockerfile
    # Solo dentro de la red de Docker: los microservicios NO se publican hacia afuera; se llega a
    # ellos únicamente a través del Gateway (puerto 8000). Para depurar con /docs se puede volver
    # a poner temporalmente:  ports: ["8001:8001"]
    expose:
      - "8001"
    volumes:
      - ./backend/servicio-postulantes/app:/app/app
      - ./backend/libs/shared/shared_kernel:/app/libs/shared_kernel
      - archivos-postulantes:/app/archivos   # CV, DNI... (en AWS van a S3)
    env_file:
      - ./backend/servicio-postulantes/.env
    depends_on:
      postgres:
        condition: service_healthy

  servicio-empresas-vacantes:
    container_name: empresas-vacantes-service
    build:
      context: ./backend
      dockerfile: servicio-empresas-vacantes/Dockerfile
    # Solo dentro de la red de Docker: los microservicios NO se publican hacia afuera; se llega a
    # ellos únicamente a través del Gateway (puerto 8000). Para depurar con /docs se puede volver
    # a poner temporalmente:  ports: ["8002:8002"]
    expose:
      - "8002"
    volumes:
      - ./backend/servicio-empresas-vacantes/app:/app/app
      - ./backend/libs/shared/shared_kernel:/app/libs/shared_kernel
    env_file:
      - ./backend/servicio-empresas-vacantes/.env
    depends_on:
      postgres:
        condition: service_healthy

  servicio-procesos-seleccion:
    container_name: procesos-seleccion-service
    build:
      context: ./backend
      dockerfile: servicio-procesos-seleccion/Dockerfile
    # Solo dentro de la red de Docker: los microservicios NO se publican hacia afuera; se llega a
    # ellos únicamente a través del Gateway (puerto 8000). Para depurar con /docs se puede volver
    # a poner temporalmente:  ports: ["8003:8003"]
    expose:
      - "8003"
    volumes:
      - ./backend/servicio-procesos-seleccion/app:/app/app
      - ./backend/libs/shared/shared_kernel:/app/libs/shared_kernel
    env_file:
      - ./backend/servicio-procesos-seleccion/.env
    depends_on:
      postgres:
        condition: service_healthy

  servicio-comunicaciones:
    container_name: comunicaciones-service
    build:
      context: ./backend
      dockerfile: servicio-comunicaciones/Dockerfile
    expose:
      - "8004"
    volumes:
      - ./backend/servicio-comunicaciones/app:/app/app
      - ./backend/libs/shared/shared_kernel:/app/libs/shared_kernel
    env_file:
      - ./backend/servicio-comunicaciones/.env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datos-postgres:
  archivos-postulantes:
