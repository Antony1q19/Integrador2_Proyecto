name: CI Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch: {}

jobs:
  build-and-lint:
    name: Lint y build de Next.js (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ERP, ANUNCIOS]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/${{ matrix.app }}/package-lock.json"

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build de producción
        run: npm run build